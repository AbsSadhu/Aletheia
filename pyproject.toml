[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aletheia"
version = "0.1.0"
description = "Terminal-First Agentic Trading Framework"
authors = ["Aletheia <admin@aletheia.local>"]
readme = "README.md"
packages = [
    { include = "aletheia" }
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.115.8"
uvicorn = {version = ">=0.30.6", extras = ["standard"]}
pydantic = ">=2.8.2"
pydantic-settings = ">=2.4.0"
click = ">=8.1.8"
python-multipart = "^0.0.31"
langchain = ">=0.3.0"
langgraph = ">=0.2.20"
httpx = ">=0.27.0"
requests = "^2.32.4"
pandas = ">=2.2.2"
numpy = ">=2.0.0"
yfinance = ">=0.2.54"
ccxt = ">=4.4.37"
duckdb = ">=1.0.0"
jinja2 = "^3.1.6"
python-dotenv = "^1.2.2"
loguru = ">=0.7.2"
typer = ">=0.12.3"
rich = ">=13.7.1"
prompt_toolkit = "^3.0.43"
alembic = "^1.13.0"


[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.2"
pytest-asyncio = ">=0.23.8"
pytest-cov = ">=5.0.0"
ruff = ">=0.6.4"
mypy = ">=1.11.1"
pip-audit = "^2.7.3"

[tool.poetry.scripts]
aletheia = "aletheia.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
