[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aletheia"
version = "0.1.0"
description = "Terminal-First Agentic Trading Framework"
authors = ["Aletheia <admin@aletheia.local>"]
readme = "README.md"
packages = [
    { include = "aletheia" }
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.115.8"
uvicorn = {version = ">=0.30.6", extras = ["standard"]}
pydantic = ">=2.8.2"
pydantic-settings = ">=2.4.0"
click = ">=8.1.8"
python-multipart = "^0.0.31"
langchain = ">=0.3.0"
langgraph = ">=0.2.20"
httpx = ">=0.27.0"
requests = "^2.32.4"
pandas = ">=2.2.2"
numpy = ">=2.0.0"
yfinance = ">=0.2.54"
ccxt = ">=4.4.37"
duckdb = ">=1.0.0"
jinja2 = "^3.1.6"
python-dotenv = "^1.2.2"
cryptography = ">=43.0.0"
keyring = ">=25.0.0"
loguru = ">=0.7.2"
typer = ">=0.12.3"
rich = ">=13.7.1"
prompt_toolkit = "^3.0.43"
alembic = "^1.13.0"
scipy = ">=1.13.0"
weasyprint = ">=60.0"
openpyxl = ">=3.1.0"
matplotlib = ">=3.9.0"
prometheus-client = ">=0.20.0"
textual = ">=0.60.0"
websockets = ">=12.0"
fastmcp = ">=4.0.0"



[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.2"
pytest-asyncio = ">=0.23.8"
pytest-cov = ">=5.0.0"
pytest-timeout = ">=2.3.1"
ruff = ">=0.6.4"
mypy = ">=1.11.1"
mypy-baseline = ">=0.7.0"
pip-audit = "^2.7.3"
pre-commit = "^3.8.0"
detect-secrets = "^1.5.0"

[tool.poetry.scripts]
aletheia = "aletheia.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
# 3.13 to match the actual dev/CI interpreter — numpy's shipped stubs use
# PEP 695 `type` statements (3.12+ syntax) that mypy can't parse when
# targeting 3.11, even though the project's own runtime requirement
# (pyproject [tool.poetry.dependencies]) stays >=3.11.
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Third-party deps with no maintained type stubs (upstream or on PyPI as a
# types-* package) — ignoring missing imports for these, not hiding real
# errors in our own code.
[[tool.mypy.overrides]]
module = [
    "ccxt",
    "duckduckgo_search",
    "kiteconnect",
    "openpyxl.*",
    "pandas",
    "praw",
    "scipy",
    "yfinance",
]
ignore_missing_imports = true
