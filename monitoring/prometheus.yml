# Prometheus scrape configuration for ALETHEIA
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "aletheia-monitor"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "aletheia-backend"
    scrape_interval: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8899"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "aletheia-backend"
