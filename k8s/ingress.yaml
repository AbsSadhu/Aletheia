apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aletheia-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: aletheia.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aletheia-service
            port:
              number: 80
