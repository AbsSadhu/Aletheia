name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install

    - name: Install Maturin and build Rust extension
      run: |
        poetry run pip install maturin
        cd aletheia_rust && poetry run maturin develop

    - name: Run Ruff (Lint)
      run: |
        poetry run ruff check .

    - name: Run Ruff (Format Check)
      run: |
        poetry run ruff format --check .

    - name: Run Mypy (Type Check)
      continue-on-error: true
      run: |
        poetry run mypy aletheia

    - name: Run Tests
      run: |
        poetry run pytest
