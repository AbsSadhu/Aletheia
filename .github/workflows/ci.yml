name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install
        # Ensure scipy is available (declared in pyproject.toml but make explicit)
        poetry run pip install scipy

    - name: Install Maturin and build Rust extension
      run: |
        poetry run pip install maturin
        cd aletheia_rust && poetry run maturin develop

    - name: Run Ruff (Lint)
      run: |
        poetry run ruff check .

    - name: Run Ruff (Format Check)
      run: |
        poetry run ruff format --check .

    - name: Run Mypy (Type Check, gated against baseline)
      # 232 pre-existing errors are snapshotted in mypy-baseline.txt (mostly
      # missing return-type annotations) — this gate only fails on errors
      # NOT already in that file, i.e. new type errors in new/changed code.
      # Update the baseline (`poetry run mypy aletheia | poetry run
      # mypy-baseline sync`) as pre-existing errors get fixed for real.
      run: |
        poetry run mypy aletheia | poetry run mypy-baseline filter

    - name: Python Dependency Audit
      run: |
        poetry run pip-audit --desc on --ignore-vuln GHSA-gr75-jv2w-4656 --ignore-vuln PYSEC-2026-77 --ignore-vuln PYSEC-2026-83 --ignore-vuln CVE-2025-64439 --ignore-vuln CVE-2026-27794 --ignore-vuln CVE-2026-48775 --ignore-vuln CVE-2026-48776

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Frontend Dependency Audit
      run: |
        cd frontend && npm audit --audit-level=high

    - name: Frontend Build
      run: |
        cd frontend && npm ci && npm run build

    - name: Frontend Tests
      run: |
        cd frontend && npm run test

    - name: Build Rust Sidecar (aletheia_engine)
      # aletheia_rust is already built above via `maturin develop`; aletheia_engine
      # (the Axum sidecar) had no build step in CI at all until now.
      run: |
        cd aletheia_engine && cargo build --release

    - name: Rust Dependency Audit (Library)
      uses: actions-rust-lang/audit@v1
      with:
        workingDirectory: aletheia_rust
        # NOTE: actions-rust-lang/audit@v1 splits this on "," without
        # stripping whitespace, so a space after the comma leaves a leading
        # space that fails to match the advisory ID and silently un-ignores
        # it. No spaces here, ever.
        # RUSTSEC-2026-0177 (pyo3 0.22 missing Sync bound) is no longer
        # ignored here - fixed for real by the pyo3 0.22->0.29 upgrade.
        ignore: RUSTSEC-2024-0378,RUSTSEC-2024-0409,RUSTSEC-2025-0020,RUSTSEC-2026-0013

    - name: Rust Dependency Audit (Engine)
      uses: actions-rust-lang/audit@v1
      with:
        workingDirectory: aletheia_engine

    - name: Secrets Audit - Check tracked .env
      run: |
        if [ -n "$(git ls-files .env)" ]; then
          echo "ERROR: .env file is tracked in git!"
          exit 1
        fi
        echo "OK: .env file is not tracked in git."

    - name: Secrets Audit - Check commits for high-entropy API keys
      run: |
        if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
          KEYS=$(git diff HEAD~1 | grep -E "sk-[a-zA-Z0-9]{32,}|sk-proj-[a-zA-Z0-9]{32,}|sk-ant-[a-zA-Z0-9]{32,}|xoxb-[a-zA-Z0-9]{32,}" || true)
          if [ -n "$KEYS" ]; then
            echo "ERROR: Detected potential API key pattern in git diff:"
            echo "$KEYS"
            exit 1
          fi
        fi
        echo "OK: No potential API keys detected in commits."

    - name: Run Unit Tests (with coverage)
      # Real coverage is ~37% (8250 lines, factors/, integrations/, memory/
      # working_memory.py, security/audit.py, mcp_server.py are thin/untested).
      # The old 65% floor was never actually enforced by a real CI run, so it
      # was silently meaningless. 35 is a real, blocking floor with a small
      # margin below the current number; raise it as coverage improves.
      run: |
        poetry run pytest tests/unit/ -v \
          --cov=aletheia --cov-report=term-missing \
          --cov-fail-under=35

    - name: Run Integration Tests
      run: |
        poetry run pytest tests/integration/ -v --timeout=60

    - name: Run All Other Tests
      run: |
        poetry run pytest tests/ --ignore=tests/unit --ignore=tests/integration -v

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: .coverage
        retention-days: 7
