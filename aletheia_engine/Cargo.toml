[package]
name = "aletheia-engine"
version = "0.1.0"
edition = "2021"
description = "Aletheia compute sidecar — Tokio HTTP server for indicator, portfolio, and DuckDB workloads"

[[bin]]
name = "aletheia-engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
