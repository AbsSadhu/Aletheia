# ============================================================
#  ALETHEIA — Production Docker Compose Stack
#  Services:
#    - backend      FastAPI + LangGraph agents (port 8899)
#    - engine       Rust compute sidecar (port 18899)
#    - ollama       Local LLM runtime (port 11434)
#    - frontend     React 19 static build served via nginx (port 5173)
#    - prometheus   Metrics scraper (port 9090)
#    - grafana      Dashboards (port 3000)
#
#  `docker compose up` alone gives you a fully working stack with zero API
#  keys. Ollama starts empty — pull a model once with:
#    docker compose exec ollama ollama pull mistral:7b
#  Until a model is pulled, every page works except LLM-backed agent runs.
# ============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: aletheia-backend
    env_file:
      - .env.example
    environment:
      - ALETHEIA_SKIP_PREFLIGHT=false
      - ALETHEIA_LOG_LEVEL=INFO
      # Container-network hostnames — only resolvable from other containers
      # on aletheia-net, unlike the browser-facing VITE_API_BASE_URL below.
      - ALETHEIA_OLLAMA_BASE_URL=http://ollama:11434
      - ALETHEIA_COMPUTE_ENGINE_URL=http://engine:18899
      - ALETHEIA_COMPUTE_ENGINE_ENABLED=true
    ports:
      - "8899:8899"
    volumes:
      - aletheia-data:/app/data
      - aletheia-logs:/app/logs
    depends_on:
      - ollama
      - engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8899/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aletheia-net

  # ----------------------------------------------------------
  # Rust Compute Sidecar
  # ----------------------------------------------------------
  engine:
    build:
      context: ./aletheia_engine
      dockerfile: Dockerfile
    container_name: aletheia-engine
    environment:
      - ALETHEIA_ENGINE_HOST=0.0.0.0
      - ALETHEIA_ENGINE_PORT=18899
    ports:
      - "18899:18899"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18899/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aletheia-net

  # ----------------------------------------------------------
  # Ollama — Local LLM Runtime
  # ----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: aletheia-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aletheia-net

  # ----------------------------------------------------------
  # React Frontend
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Resolved from the browser on the host, not from inside the compose
        # network — must be the host-mapped backend port, not `http://backend:8899`.
        VITE_API_BASE_URL: http://localhost:8899
    container_name: aletheia-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aletheia-net

  # ----------------------------------------------------------
  # Prometheus — Metrics Scraper
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aletheia-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aletheia-net

  # ----------------------------------------------------------
  # Grafana — Observability Dashboards
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: aletheia-grafana
    profiles: ["observability"]
    environment:
      # A hard-required var here (`:?...`) blocks `docker compose config` for
      # EVERY service, not just this one -- Compose interpolates the whole
      # file up front regardless of which `profiles` are active. Defaulting
      # to "admin" keeps the zero-config `docker compose up` promise; this
      # is a local dev default, not a production one -- set a real
      # GRAFANA_ADMIN_PASSWORD in .env before exposing port 3000 publicly.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/aletheia.json
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging
    networks:
      - aletheia-net

networks:
  aletheia-net:
    driver: bridge

volumes:
  aletheia-data:
  aletheia-logs:
  prometheus-data:
  grafana-data:
  ollama-data:
