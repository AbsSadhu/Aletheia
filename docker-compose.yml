version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    env_file:
      - .env.example
    ports:
      - "8899:8899"
    volumes:
      - ./backend:/app
      - aletheia-data:/app/data
    command: uvicorn src.main:app --host 0.0.0.0 --port 8899 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8899
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  aletheia-data:

